[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "setuptools>=64",
    "wheel",
    "setuptools-scm>=8"
]

[project]
name = "ageUpscaling"
dynamic = ["version"]
description = "A toolbox for upscaling forest age from NFI data"
readme = "README.md"
authors = [
    { name = "Simon Besnard", email = "besnard@gfz.de" }
]
license = { file = "LICENSE" }
keywords = ["geospatial", "Forest Age"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: European Union Public Licence 1.2 (EUPL 1.2)"
]
requires-python = ">=3.10"
dependencies = [
    # --- Array / cube stack ---
    "zarr>=2.18,<3",
    "numcodecs>=0.10,<0.16,!=0.14.0,!=0.14.1",
    "xarray>=2023.10.1",
    "netCDF4",
    "dask",
    "pandas",
    "fsspec",
    "aiohttp",
    "numpy>=1.26,<2",
    # --- ML ---
    "scikit-learn",
    "Boruta",
    "optuna",
    "optuna-integration[xgboost]",
    "xgboost>=3.4.1",
    "shap",
    "numba",
    "sklearn-genetic-opt",
    "statsmodels",
    "pymc",
    # --- Geospatial ---
    "rioxarray",
    "rasterio",
    "cartopy",
    "shapely",
    "geopandas",
    "scipy",
    # --- Utilities ---
    "PyYAML",
    "matplotlib",
    "bottleneck",
    "tqdm",
    "dask_jobqueue",
]

[project.urls]
homepage = "https://github.com/simonbesnard1/forest-age-upscale"
source = "https://github.com/simonbesnard1/forest-age-upscale"
tracker = "https://github.com/simonbesnard1/forest-age-upscale/issues"

[project.optional-dependencies]
accel = [
    "numbagg",
    "flox",
    "opt_einsum",
    "cython"
]
dev = [
    "hypothesis",
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "pytest-env",
    "pytest-xdist",
    "pytest-timeout",
    "ruff",
    "ageUpscaling[full]",
    "black",
    "isort"
]
io = [
    # zarr, fsspec, netCDF4, rasterio are core dependencies now; this
    # extra is for additional/optional I/O backends only.
    "boto3",
    "h5netcdf",
    'pydap; python_version<"3.10"',
    "cftime",
    "pooch",
    "pyproj"
]
plotting = [
    "pystac",
    "pystac-client",
    "planetary-computer",
    "odc-stac"
]
viz = [
    "seaborn",
    "nc-time-axis",
    "plotly",
    "holoviews"
]
debug = [
    "rich",
    "loguru"
]

full = [
    "ageUpscaling[accel,io,plotting,viz,debug]"
]

[tool.mypy]
enable_error_code = ["ignore-without-code", "redundant-self", "redundant-expr"]
exclude = [
  'build',
]
files = "ageUpscaling"
show_error_context = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.ruff]
extend-exclude = [
  "doc",
  "_typed_ops.pyi",
]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["ageUpscaling/tests*", "ageUpscaling/tests/*", "ageUpscaling/tests/**/*", "scripts*"]

[tool.setuptools_scm]
fallback_version = "9999"

